server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers pinned to a bundle that no longer exists.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: buffering here would hold events until the buffer filled, which
        # in practice means the console never updates.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # SPA fallback — every unmatched path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

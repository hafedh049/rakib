[project]
name = "rakib-backend"
version = "0.1.0"
description = "Rakib — plateforme intelligente de gestion des reclamations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "beanie>=1.27,<2",
    "motor>=3.6,<4",
    "pyjwt>=2.9,<3",
    "argon2-cffi>=23.1,<24",
    "structlog>=24.4,<25",
    "arq>=0.26,<0.27",
    "redis>=5.2,<6",
    "aiosmtplib>=3.0,<4",
    "python-multipart>=0.0.12,<0.1",
    "aioboto3>=13.2,<14",
    "email-validator>=2.2,<3",
    "scikit-learn>=1.5,<1.6",
    "numpy>=1.26,<2.2",
    "scipy>=1.14,<2",
    "joblib>=1.4,<2",
    "rank-bm25>=0.2.2,<0.3",
    "rapidfuzz>=3.10,<4",
    "fasttext-wheel>=0.9.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<2",
    "pytest-cov>=6.0,<7",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "time-machine>=2.16,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: Motor binds its client to the loop that
# first drives it, so per-test loops would break the session-scoped connection.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app/services", "app/intelligence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE: blind `except Exception` must carry a noqa explaining why swallowing is
# correct. Several are (publish, notifiers, health probes) — but each is a choice.
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "BLE"]
# B008: FastAPI's Depends() in defaults is the framework idiom.
# RUF012: Beanie's `class Settings: indexes = [...]` is its documented convention.
# RUF001-003: "ambiguous unicode" fires on every Arabic letter. This system
# processes Arabic and derja by design, so the check is noise here.
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# gold.py is a hand-authored data table; wrapping the rows would make the
# corpus harder to read and edit than the long lines it replaces.
"scripts/gold.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

# Rakib — namespace `reclamations`, fully self-contained.
#
# Nothing here is shared with any other project on the cluster: its own Mongo,
# Redis and MinIO, its own secrets, its own ingress host. The only borrowed
# thing is the SMTP relay credential, copied in by deploy/deploy.sh.
#
# The API is pinned to 2 vCPU / 4 GB so the project's headline constraint is
# enforced rather than asserted.
---
apiVersion: v1
kind: Namespace
metadata:
  name: reclamations
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rakib-config
  namespace: reclamations
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  MONGO_URI: mongodb://mongo:27017/reclamations
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: reclamations
  TRIAGE_BACKEND: ml
  ML_ARTIFACTS_DIR: /app/ml_artifacts
  CATEGORY_CONFIDENCE_THRESHOLD: '0.55'
  AMBIGUITY_MARGIN: '0.15'
  DEDUP_AUTO_THRESHOLD: '0.82'
  DEDUP_SUGGEST_THRESHOLD: '0.65'
  DEDUP_CROSS_CLAIMANT_THRESHOLD: '0.90'
  RETRAIN_MIN_SAMPLES: '200'
  RETRAIN_CORRECTION_TRIGGER: '50'
  RETRAIN_F1_TOLERANCE: '0.02'
  SLA_BUSINESS_HOURS: 'false'
  SLA_TIMEZONE: Africa/Tunis
  SLA_HOURS_P1: '4'
  SLA_HOURS_P2: '24'
  SLA_HOURS_P3: '72'
  SLA_HOURS_P4: '168'
  SMTP_PORT: '587'
  SMTP_STARTTLS: 'true'
  FRONTEND_URL: https://reclamations.activiity.com
  PUBLIC_URL: https://reclamations.activiity.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: reclamations
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: reclamations
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: reclamations
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: reclamations
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          args: ['--quiet']
          ports: [{ containerPort: 27017 }]
          volumeMounts:
            - { name: data, mountPath: /data/db }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: '2', memory: 2Gi }
          readinessProbe:
            # A TCP probe, not mongosh: spawning a shell costs more than the
            # default 1s probe timeout allows, so the exec form never passed.
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongo-data }
---
apiVersion: v1
kind: Service
metadata: { name: mongo, namespace: reclamations }
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: reclamations
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ['redis-server', '--appendonly', 'yes']
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec: { command: ['redis-cli', 'ping'] }
            initialDelaySeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: reclamations }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: reclamations
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: ['server', '/data']
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: rakib-secret, key: S3_ACCESS_KEY } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: rakib-secret, key: S3_SECRET_KEY } }
          ports: [{ containerPort: 9000 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: reclamations }
spec:
  selector: { app: minio }
  ports: [{ port: 9000, targetPort: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: reclamations
spec:
  # One replica on purpose: the classifier is swapped in memory on promotion,
  # and a second replica would keep serving the old model until it restarted.
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: rakib-backend:latest
          imagePullPolicy: IfNotPresent
          command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--workers', '1']
          envFrom:
            - configMapRef: { name: rakib-config }
            - secretRef: { name: rakib-secret }
          ports: [{ containerPort: 8000 }]
          resources:
            # The 2 vCPU / 4 GB envelope the project claims — enforced here.
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: '2', memory: 4Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: reclamations }
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: reclamations
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: rakib-backend:latest
          imagePullPolicy: IfNotPresent
          command: ['arq', 'app.workers.settings.WorkerSettings']
          envFrom:
            - configMapRef: { name: rakib-config }
            - secretRef: { name: rakib-secret }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: '2', memory: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: reclamations
spec:
  replicas: 1
  selector: { matchLabels: { app: notifier } }
  template:
    metadata: { labels: { app: notifier } }
    spec:
      containers:
        - name: notifier
          image: rakib-backend:latest
          imagePullPolicy: IfNotPresent
          command: ['python', '-m', 'app.workers.notify_worker']
          envFrom:
            - configMapRef: { name: rakib-config }
            - secretRef: { name: rakib-secret }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: reclamations
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: rakib-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: reclamations }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rakib
  namespace: reclamations
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '12m'
    # SSE again: the ingress must not buffer the event stream either.
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [reclamations.activiity.com]
      secretName: rakib-tls
  rules:
    - host: reclamations.activiity.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
